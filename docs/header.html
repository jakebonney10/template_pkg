<!-- HTML header for doxygen 1.18.0, regenerate with `doxygen -w html` when Doxygen changes -->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "https://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="$langISO">
<head>
<meta http-equiv="Content-Type" content="text/xhtml;charset=UTF-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=11"/>
<meta name="generator" content="Doxygen $doxygenversion"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!--BEGIN PROJECT_NAME--><title>$projectname: $title</title><!--END PROJECT_NAME-->
<!--BEGIN !PROJECT_NAME--><title>$title</title><!--END !PROJECT_NAME-->
<!--BEGIN PROJECT_ICON-->
<link rel="icon" href="$relpath^$projecticon" type="image/x-icon" />
<!--END PROJECT_ICON-->
<link href="$relpath^tabs.css" rel="stylesheet" type="text/css"/>
<!--BEGIN FULL_SIDEBAR-->
<meta name="doxygen-page-layout" content="1" />
<!--END FULL_SIDEBAR-->
<!--BEGIN HTML_DYNAMIC_SECTIONS-->
<script type="text/javascript" src="$relpath^dynsections.js"></script>
<!--END HTML_DYNAMIC_SECTIONS-->
<!--BEGIN HTML_CODE_FOLDING-->
<script type="text/javascript" src="$relpath^codefolding.js"></script>
<!--END HTML_CODE_FOLDING-->
<!--BEGIN COPY_CLIPBOARD-->
<script type="text/javascript" src="$relpath^clipboard.js"></script>
<!--END COPY_CLIPBOARD-->
$treeview
$search
$mathjax
$darkmode
$mermaidjs
<link href="$relpath^$stylesheet" rel="stylesheet" type="text/css" />
<link href="$relpath^pagefind/pagefind-component-ui.css" rel="stylesheet" type="text/css" />
<!-- Must stay a classic script (not type="module"): Pagefind locates its index
     from this tag, which is what makes search work under a sub-path such as
     https://<owner>.github.io/<repository>/. -->
<script defer src="$relpath^pagefind/pagefind-component-ui.js"></script>
$extrastylesheet
<script type="text/javascript" src="$relpath^doxygen-awesome-darkmode-toggle.js"></script>
<script type="text/javascript">
    DoxygenAwesomeDarkModeToggle.init()
</script>
</head>
<body>
<!--BEGIN FULL_SIDEBAR-->
<div id="side-nav" class="ui-resizable side-nav-resizable"><!-- do not remove this div, it is closed by doxygen! -->
<!--END FULL_SIDEBAR-->

<div id="top"><!-- do not remove this div, it is closed by doxygen! -->

<!--BEGIN TITLEAREA-->
<div id="titlearea">
<table cellspacing="0" cellpadding="0">
 <tbody>
 <tr id="projectrow">
  <!--BEGIN PROJECT_LOGO-->
  <td id="projectlogo"><img alt="Logo" src="$relpath^$projectlogo"$logosize/></td>
  <!--END PROJECT_LOGO-->
  <!--BEGIN PROJECT_NAME-->
  <td id="projectalign">
   <div id="projectname">$projectname<!--BEGIN PROJECT_NUMBER--><span id="projectnumber">&#160;$projectnumber</span><!--END PROJECT_NUMBER-->
   </div>
   <!--BEGIN PROJECT_BRIEF--><div id="projectbrief">$projectbrief</div><!--END PROJECT_BRIEF-->
  </td>
  <!--END PROJECT_NAME-->
  <!--BEGIN !PROJECT_NAME-->
   <!--BEGIN PROJECT_BRIEF-->
    <td>
    <div id="projectbrief">$projectbrief</div>
    </td>
   <!--END PROJECT_BRIEF-->
  <!--END !PROJECT_NAME-->
  <!--BEGIN DISABLE_INDEX-->
   <!--BEGIN SEARCHENGINE-->
     <!--BEGIN !FULL_SIDEBAR-->
    <td>$searchbox</td>
     <!--END !FULL_SIDEBAR-->
   <!--END SEARCHENGINE-->
  <!--END DISABLE_INDEX-->
 </tr>
  <!--BEGIN SEARCHENGINE-->
   <!--BEGIN FULL_SIDEBAR-->
   <tr><td colspan="2">$searchbox</td></tr>
   <!--END FULL_SIDEBAR-->
  <!--END SEARCHENGINE-->
 </tbody>
</table>
</div>
<!-- Full-text search (Pagefind).  The index in pagefind/ is generated from
     the built HTML by the Pages workflow.  The wrapper reuses the id of
     Doxygen's own search box so the theme positions it, and the dark-mode
     toggle, in the usual place. -->
<div id="docs-search">
  <div id="MSearchBox">
    <pagefind-modal-trigger placeholder="Search docs"></pagefind-modal-trigger>
  </div>
</div>
<pagefind-modal></pagefind-modal>
<!-- Search result metadata.  Without the title Pagefind uses the first
     heading on the page.  The empty image fields stop it from picking up the
     Doxygen footer logo, whose alt text would otherwise match every page. -->
<span data-pagefind-meta="title" hidden>$title</span>
<span data-pagefind-meta="image[data-none], image_alt[data-none]" data-none="" hidden></span>
<!--END TITLEAREA-->
<!-- end header part -->
