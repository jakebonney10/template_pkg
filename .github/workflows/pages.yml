name: Pages
on:
  push:
    branches:
      - master
      - main
      
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Stamp the docs with the latest release tag (e.g. v1.2.3, or
      # v1.2.3-4-gabc1234 when master is ahead of it).  Falls back to the
      # version in package.xml while the repository has no tags.
      - name: Set documentation version
        run: |
          version="$(git describe --tags 2>/dev/null || sed -n 's:.*<version>\(.*\)</version>.*:\1:p' template_pkg/package.xml | head -n 1)"
          echo "Documentation version: $version"
          echo "PROJECT_NUMBER = \"$version\"" >> docs/Doxyfile
      - name: Generate Documentation
        uses: mattnotmitt/doxygen-action@edge
        with:
            working-directory: 'docs/'
            doxyfile-path: 'Doxyfile'
            
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_doxygen/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      
