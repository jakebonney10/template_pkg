name: Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Only one deployment at a time; let a running deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Stamp the docs with the latest release tag (e.g. v1.2.3, or
      # v1.2.3-4-gabc1234 when master is ahead of it).  Falls back to the
      # version in package.xml while the repository has no tags.
      - name: Set documentation version
        run: |
          version="$(git describe --tags 2>/dev/null || sed -n 's:.*<version>\(.*\)</version>.*:\1:p' template_pkg/package.xml | head -n 1)"
          echo "Documentation version: $version"
          echo "PROJECT_NUMBER = \"$version\"" >> docs/Doxyfile
      - name: Generate Documentation
        uses: mattnotmitt/doxygen-action@edge
        with:
          working-directory: 'docs/'
          doxyfile-path: 'Doxyfile'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/_doxygen/html'

  # Deploying in a separate job gives the uploaded artifact time to become
  # available; deploying in the same job as the upload fails intermittently.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
